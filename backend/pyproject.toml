[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ristorante-ai-backend"
version = "0.1.0"
description = "FastAPI backend for Ristorante AI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.5",
  "cryptography>=44.0.2",
  "email-validator>=2.2.0",
  "fastapi>=0.116.0",
  "flask>=3.1.0",
  "httpx>=0.28.1",
  "phonenumbers>=9.0.2",
  "psycopg[binary]>=3.2.6",
  "pwdlib[argon2]>=0.2.1",
  "pydantic-settings>=2.8.1",
  "pyjwt>=2.10.1",
  "python-dotenv>=1.1.0",
  "python-multipart>=0.0.20",
  "sentry-sdk[fastapi]>=2.28.0",
  "sqlalchemy>=2.0.39",
  "uvicorn[standard]>=0.34.0",
  "websockets>=15.0.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]
