{% extends "base.html" %}
{% block title %}Reservation Lab — demo{% endblock %}
{% block content %}
<div class="lab-marketing-narrow">
  <p class="lab-marketing-kicker" data-i18n="homeKicker">Reservation Lab</p>
  <h1 class="lab-marketing-title" data-i18n="homeTitle">Restaurant Voice Agent</h1>
  <p class="lab-marketing-lead" data-i18n="homeLead">Open the allocation prototype (Reservation Lab):</p>

  {% if setup_message %}
  <p class="lab-muted" style="margin-top:1rem;text-align:center;max-width:28rem;margin-left:auto;margin-right:auto">{{ setup_message }}</p>
  {% endif %}

  <div class="lab-home-view-toggles" role="group" aria-label="View mode">
    <a class="lab-btn lab-btn-secondary lab-home-view-toggle" href="{{ url_for('add_restaurant_pick') }}" data-i18n="homeOwnerView">Owner view</a>
    <a class="lab-btn lab-btn-secondary lab-home-view-toggle" href="{{ url_for('agent_lab') }}" data-i18n="homeAgentView">Agent view</a>
  </div>

  <div class="lab-marketing-lang" aria-label="Language">
    <button type="button" class="lab-mLangBtn is-active" data-lang="en" aria-pressed="true">English</button>
    <button type="button" class="lab-mLangBtn" data-lang="it" aria-pressed="false">Italiano</button>
  </div>
</div>
{% endblock %}
